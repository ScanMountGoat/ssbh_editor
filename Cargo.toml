[package]
name = "ssbh_editor"
version = "0.11.1"
authors = ["SMG"]
edition = "2024"
description = "View, edit, and validate models for Smash Ultimate"

[dependencies]
egui = { version = "0.37.0", default-features = false }
egui_extras = { version = "0.37.0", features = ["svg"] }
egui-wgpu = "0.37.0"
egui_plot = "0.38.0"
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "x11", "wgpu"] }
egui_dnd = "0.18.0"
egui_commonmark = "0.26.0"
wgpu = "30.0.1"
glam = { version = "0.34.3", features = ["bytemuck", "serde"] }
rfd = "0.18.0"
ssbh_wgpu = { git = "https://github.com/ScanMountGoat/ssbh_wgpu", rev = "c6f2be0" }
nutexb_wgpu = { git = "https://github.com/ScanMountGoat/ssbh_wgpu", rev = "c6f2be0" }
ssbh_data = { git = "https://github.com/ultimate-research/ssbh_lib", rev = "c1149c2", features = ["strum", "serde"] }
strum = "0.27.2"
nutexb = { git = "https://github.com/jam1garner/nutexb", rev = "7db7c08" }
octocrab = "0.54.9"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }
open = "5.2.0"
log = "0.4.17"
serde_json = "1.0"
strip-ansi-escapes = "0.2.0"
image = "0.25.1"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
xmltree = "0.12.0"
anyhow = "1.0"
thiserror = "2.0"
futures-intrusive = "0.5.0" # TODO: Avoid these dependencies?
futures = "0.3"
pico-args = "0.5.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
approx = "0.5.1"
semver = "1.0"
chrono = "0.4"
wuff = "0.2.8"

[dev-dependencies]
pretty_assertions = "1.0"

# Optimize for binary size
[profile.release-lto]
inherits = "release"
strip = "debuginfo"
lto = true

[package.metadata.bundle]
identifier = "ssbh_editor"
icon = ["src/icons/SsbhEditor512_mac.png"]
